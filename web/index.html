
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Periferia - Agente de OC</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f3f6f5;
      margin: 0;
      color: #18352d;
    }
    .wrap {
      max-width: 860px;
      margin: 30px auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 30px #0001;
    }
    header {
      border-bottom: 1px solid #ddd;
      padding-bottom: 14px;
    }
    h1 {
      margin: 0;
      color: #146447;
      font-size: 25px;
    }
    #messages {
      height: 420px;
      overflow: auto;
      padding: 16px 0;
    }
    .msg {
      margin: 12px 0;
      padding: 12px;
      border-radius: 10px;
      white-space: pre-wrap;
    }
    .user {
      background: #e9f1ff;
      margin-left: 15%;
    }
    .bot {
      background: #edf6ee;
      margin-right: 10%;
    }
    .tool {
      font-size: 12px;
      background: #f5f5f5;
      padding: 8px;
      margin: 6px 0;
      border-left: 3px solid #5c8c73;
      white-space: pre-wrap;
    }
    .warn {
      background: #fff0c9;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
    }
    form {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #aaa;
      border-radius: 8px;
    }
    button {
      background: #176a4b;
      color: white;
      border: 0;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    .hint {
      color: #666;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Agente de órdenes de compra</h1>
      <p class="hint">
        SAP simulado · Controles RC1-RC10 · Evidencia y trazabilidad
      </p>
    </header>

    <div id="messages" aria-live="polite">
      <div class="msg bot">
        Hola. Prueba "procesa sol-001" o "procesa sol-004".
        Si hay excepciones, te pediré confirmación.
      </div>
    </div>

    <form id="form">
      <input
        id="input"
        placeholder="Escribe: procesa sol-001"
        required
        autocomplete="off"
      >
      <button id="send" type="submit">Enviar</button>
    </form>

    <p class="hint">
      Las operaciones y herramientas aparecen en el historial.
      No hay conexión a SAP real.
    </p>
  </main>

  <script>
    const sessionId = crypto.randomUUID();
    const messages = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');

    function add(text, className) {
      const element = document.createElement('div');
      element.className = className;
      element.textContent = String(text ?? '');
      messages.appendChild(element);
      messages.scrollTop = messages.scrollHeight;
      return element;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const message = input.value.trim();
      if (!message) return;

      input.value = '';
      send.disabled = true;

      add(message, 'msg user');
      const waiting = add('Procesando...', 'msg bot');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            sessionId: sessionId,
            message: message
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || data.message || 'Error del servidor'
          );
        }

        waiting.remove();

        for (const tool of data.toolCalls || []) {
          add(
            tool.name + ' - ' +
            JSON.stringify(tool.result, null, 2),
            'tool'
          );
        }

        add(
          data.reply || 'Solicitud procesada sin respuesta textual.',
          'msg bot'
        );

        if (data.needsConfirmation) {
          add(
            'Confirmación humana requerida. Escribe: confirmo',
            'warn'
          );
        }

      } catch (error) {
        waiting.textContent = 'Error: ' + error.message;
        console.error('Error del agente:', error);
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
